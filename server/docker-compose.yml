# Keycloak for the reference server's end-to-end tests (specs/003): the realm `tresor` is imported at
# start (testdata/keycloak/realm-tresor.json). Test credentials only - never a real deployment.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.4}
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18480}:8080"
    volumes:
      - ./testdata/keycloak/realm-tresor.json:/opt/keycloak/data/import/realm-tresor.json:ro
