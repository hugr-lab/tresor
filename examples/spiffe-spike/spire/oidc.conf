# SPIRE's OIDC discovery provider (tresor specs/046): the trust domain's JWT keys at /keys, for Keycloak's
# SPIFFE identity provider (its bundle endpoint). Plain http inside the compose network - the spike only.
log_level = "INFO"
domains = ["spire-oidc", "127.0.0.1", "localhost"]
insecure_addr = ":8008"
allow_insecure_scheme = true

server_api {
    address = "unix:///run/spire/sockets/server/api.sock"
}
