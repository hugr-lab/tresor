# SPIRE server for the spike (tresor specs/046). Test trust domain only - never a real deployment.
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "tresor.example"
    data_dir = "/run/spire/data"
    socket_path = "/run/spire/sockets/server/api.sock"
    log_level = "INFO"
    ca_ttl = "24h"
    # JWT-SVIDs live minutes; no jwt_issuer, so they carry no iss (Keycloak's SPIFFE authentication wants none)
    default_jwt_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "memory" {
        plugin_data {}
    }
}
