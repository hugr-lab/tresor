# SPIRE agent for the spike (tresor specs/046): attested by a join token, workloads by their uid.
agent {
    data_dir = "/run/spire/data"
    socket_path = "/run/spire/sockets/agent/api.sock"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    trust_domain = "tresor.example"
    # the spike has no out-of-band trust bundle: the first contact is trusted (never in a real deployment)
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "memory" {
        plugin_data {}
    }
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
