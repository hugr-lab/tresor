# The build community-extensions runs, run here first: the very reusable workflow they call, with the
# same inputs, on every platform they cover. Like duckdb-acl, it builds against the 2.0 LINE
# (`duckdb_version: v2.0-cyanoptera`, the branch head) rather than our submodule pin - an early warning
# for drift before we bump the pin.
name: Distribution build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: distribution-${{ github.ref }}
  # runs fill the caches; a cancelled one leaves nothing behind for the next
  cancel-in-progress: false

jobs:
  build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      extension_name: tresor
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      # wasm is out for now (specs/035): tresor's wasm build compiles and logs in through the page
      # (tresor_web_login, specs/020), but needs duckdb-wasm on DuckDB 2.0, and is not in CI yet
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
      # One vcpkg binary cache with duckdb-acl, acl-otel and hugr-node (Cloudflare R2, duckdb-acl's
      # docs/vcpkg-cache-r2.md): vcpkg keys packages by ABI hash, so the repositories share it without
      # colliding - and the MinGW triplet (vcpkg_triplets/) is the same file in each, since its bytes are
      # part of that hash. With the variable and the four secrets unset the reusable workflow falls back
      # to duckdb's public read-only cache - correct, merely slow.
      vcpkg_binary_sources: ${{ vars.VCPKG_BINARY_SOURCES }}
    secrets:
      VCPKG_CACHING_AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      VCPKG_CACHING_AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      VCPKG_CACHING_AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      VCPKG_CACHING_AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
