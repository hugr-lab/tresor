name: Deploy docs

# Publishes website/ to GitHub Pages at https://hugr-lab.github.io/tresor/ - and, when the org enables it
# (DOCS_IONOS), the same docs to https://hugr-lab.com/docs/tresor/ on IONOS.
#
# The docs build from MAIN, and Docusaurus VERSIONING keeps released content
# authoritative - done here, at build time, from the TAGS: for every release tag
# v<X.Y.Z> the tag's website/docs is snapshotted as version X.Y.Z (the same
# `docs:version` the maintainer would run, on the tag's tree), so the latest
# release serves at the ROOT and the live docs/ tree publishes as "Next" under
# /next/ with an unreleased banner. Nothing is committed for it: the tag is the
# snapshot, and versions.json / versioned_docs/ are generated and gitignored
#. A main push only ever changes /next/; a release changes the root.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
    # a release tag is a new docs version: the push of the tag is a user's event and runs this; a
    # GitHub release made with GITHUB_TOKEN starts no workflows, so `release: published` would never
    # fire (learned in hugr-lab/mssql-ducklake)
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the tags are the released versions of the docs
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Snapshot the released docs from the tags
        # from the repository root: git's pathspecs are relative to the working directory
        shell: bash
        run: |
          (cd website && npm ci)
          git fetch --tags --force
          for tag in $(git tag --list 'v*' | sort -V); do
            case "$tag" in *-*) echo "$tag is a pre-release - not a docs version"; continue;; esac
            ver="${tag#v}"
            if [ -z "$(git ls-tree -d --full-tree "$tag" -- website/docs)" ]; then
              echo "$tag carries no website/docs - skipped"
              continue
            fi
            rm -rf snapshot && mkdir snapshot
            git archive --format=tar "$tag" website/docs website/sidebars.ts | tar -x -C snapshot
            mv website/docs website/docs.next && mv snapshot/website/docs website/docs
            cp website/sidebars.ts website/sidebars.next.ts && cp snapshot/website/sidebars.ts website/sidebars.ts
            (cd website && npx docusaurus docs:version "$ver")
            rm -rf website/docs && mv website/docs.next website/docs
            mv website/sidebars.next.ts website/sidebars.ts && rm -rf snapshot
            echo "snapshotted $tag as $ver"
          done
          cat website/versions.json 2>/dev/null || echo "no released docs yet - the current docs are the only version"

      - name: Build the docs site
        working-directory: website
        env:
          # while the hugr-lab.com copy exists, this copy names it as canonical and has no sitemap
          DOCS_CANONICAL: ${{ vars.DOCS_IONOS == 'true' && 'https://hugr-lab.com/docs/tresor/' || '' }}
        run: npx docusaurus build

      # The same docs, versions included, for https://hugr-lab.com/docs/tresor/ on IONOS (Apache, the site's CSP:
      # nothing from another server). Off until the org variable DOCS_IONOS is 'true'; the SFTP secrets are the
      # org's. Only on the events that deploy Pages: this workflow never runs on a pull request.
      - name: Build for hugr-lab.com
        if: ${{ vars.DOCS_IONOS == 'true' }}
        working-directory: website
        env:
          DOCS_TARGET: ionos
        run: npm run build -- --out-dir build-ionos

      # on the real build, released versions included: docs-build.yml checks a PR's tree, which has no tag
      # snapshots - and an old version's page may carry a badge from another server (mssql-ducklake's did)
      - name: Check the hugr-lab.com copy requests no other server
        if: ${{ vars.DOCS_IONOS == 'true' }}
        working-directory: website
        run: |
          found=$(grep -rhoE "(src=\"|srcset=\"|url\(|@import )['\"]?https?://[^\"') ]+" build-ionos | sort -u || true)
          if [ -n "$found" ]; then echo "third-party requests in the hugr-lab.com build:"; echo "$found"; exit 1; fi

      - name: Upload to hugr-lab.com (IONOS)
        if: ${{ vars.DOCS_IONOS == 'true' }}
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE: ${{ vars.IONOS_DOCS_ROOT || '/hugr-lab/docs' }}/tresor
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Mirrors the build into <docs root>/tresor on IONOS; nothing outside that folder is touched.
          lftp --env-password -u "$USER" -e "set sftp:auto-confirm yes; set net:max-retries 3; \
            mirror --reverse --delete --verbose website/build-ionos/ $REMOTE; bye" \
            "sftp://$HOST"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

      - id: deployment
        uses: actions/deploy-pages@v5
