# CI, layout after hugr-lab/mssql-ducklake and duckdb-acl: lint + a Linux build-and-test on every PR,
# a representative macOS build on merges to main and manual runs. Full platform coverage lives in
# distribution.yml, the docs site in docs-build.yml / pages.yml.
#
# tresor rides the 2.0 line at duckdb-acl's duckdb commit (see CLAUDE.md): on a server they load into
# one DuckDB. A red build means our code or a deliberate pin bump.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # duckdb's pinned formatter (scripts/format.py: clang_format==11.0.1), called by full path so no
      # runner binary can shadow it. .clang-format is a real copy: this job checks out no submodules.
      - name: Install duckdb's pinned clang-format
        run: |
          python3 -m venv /tmp/cf
          /tmp/cf/bin/pip install clang_format==11.0.1
      - name: clang-format check
        run: |
          find src \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 /tmp/cf/bin/clang-format --dry-run --Werror
      - name: yamllint
        run: |
          pip install yamllint
          yamllint .github/workflows
      - name: No absolute internal doc links
        run: python3 scripts/ci/check_docs_links.py
      - name: gofmt (the reference server)
        run: |
          out="$(gofmt -l server)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

  # the reference duckdb-secrets/1 server (specs/003): its own tests - token verification, every
  # route with its permission and precondition cases, the encrypted store - no C++ build needed
  server:
    name: Reference server (go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  build-test-linux:
    name: Build + test (linux_amd64)
    runs-on: ubuntu-24.04
    env:
      GEN: ninja
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      TRESOR_TEST_HTTPFS: '1'   # httpfs in the test build (specs/006; extension_config.cmake)
      # duckdb-acl itself in the test build, lean (no arrow, no quack), for the actor's end-to-end test (specs/008)
      TRESOR_TEST_ACL_DIR: ${{ github.workspace }}/_acl
      ACL_NO_FLIGHT: '1'
      ACL_NO_QUACK_EMBED: '1'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # duckdb-acl at the commit the actor test pins, its duckdb checked to be ours (specs/008)
      - name: duckdb-acl for the actor test
        run: scripts/ci/acl_checkout.sh "$TRESOR_TEST_ACL_DIR"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      # the lint job checks format against the repo's own .clang-format copy; this job has the
      # submodules, so it is the one that can tell when that copy drifts from duckdb's
      - name: clang-format config is in sync with duckdb
        run: diff <(tail -n +2 .clang-format) duckdb/.clang-format

      # OpenSSL (the https client, specs/002) comes from vcpkg through the merged manifest - the
      # standard duckdb-extension dependency flow
      - name: Setup vcpkg
        run: make vcpkg-setup

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-linux_amd64-${{ hashFiles('.gitmodules', 'vcpkg.json', 'extension_config.cmake') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-linux_amd64-${{ hashFiles('.gitmodules', 'vcpkg.json', 'extension_config.cmake') }}-
            vcpkg-bincache-linux_amd64-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux_amd64-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux_amd64-${{ hashFiles('.gitmodules') }}-
            ccache-linux_amd64-

      - name: Build
        run: |
          EXT_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" make
          ccache -s

      # the artifact must LOAD, not only compile - and an ATTACH 'tresor:...' alone must load it
      - name: The artifact loads
        run: scripts/ci/smoke_load.sh

      # the floor keeps a suite that silently skipped everything from passing
      - name: Unit suites
        run: |
          set -o pipefail   # a failing script must fail the step, whatever the summary line says
          build/release/test/unittest 'test/sql/*' 2>&1 | tee suite.log
          scripts/ci/assert_ran.sh suite.log 3 20

      # the attach tests against the fake service + IdP (specs/002); none of them may skip here
      - name: Attach suites
        run: |
          set -o pipefail   # a failing script must fail the step, whatever the summary line says
          scripts/ci/test_attach.sh 2>&1 | tee attach.log
          scripts/ci/assert_ran.sh attach.log 8 380 'require-env TRESOR_TEST_PORT|require httpfs|require acl_stub'

      # the reference server next to a real Keycloak (specs/003): the conformance suite, a real
      # browser login (PKCE, Keycloak's redirect checks) and a real client-credentials grant
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # ... and tresor acting for a real duckdb-acl session (specs/008): the acl built above, a real token exchange
      - name: Keycloak end to end
        run: |
          set -o pipefail   # a failing script must fail the step, whatever the summary line says
          TRESOR_ACL_EXTENSION="$PWD/build/release/extension/acl/acl.duckdb_extension" \
            scripts/ci/test_keycloak.sh 2>&1 | tee keycloak.log
          scripts/ci/assert_ran.sh keycloak.log 4 45 'require-env TRESOR_CONFORMANCE'
          grep -q "with duckdb-acl, a session's statements ran as its user" keycloak.log

      - name: Upload extension artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tresor-linux_amd64
          path: build/release/extension/tresor/tresor.duckdb_extension

  # Representative second platform; PRs stay on the Linux job to keep them fast
  build-test-osx:
    name: Build + test (osx_arm64)
    runs-on: macos-14
    if: ${{ github.event_name != 'pull_request' }}
    env:
      GEN: ninja
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      TRESOR_TEST_HTTPFS: '1'   # httpfs in the test build (specs/006; extension_config.cmake)
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_bincache,readwrite'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: brew install ninja ccache

      # OpenSSL (the https client, specs/002) comes from vcpkg through the merged manifest - the
      # standard duckdb-extension dependency flow
      - name: Setup vcpkg
        run: make vcpkg-setup

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: vcpkg_bincache
          key: vcpkg-bincache-osx_arm64-${{ hashFiles('.gitmodules', 'vcpkg.json', 'extension_config.cmake') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bincache-osx_arm64-${{ hashFiles('.gitmodules', 'vcpkg.json', 'extension_config.cmake') }}-
            vcpkg-bincache-osx_arm64-

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-osx_arm64-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            ccache-osx_arm64-${{ hashFiles('.gitmodules') }}-
            ccache-osx_arm64-

      - name: Build
        run: |
          EXT_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" make
          ccache -s

      - name: The artifact loads
        run: scripts/ci/smoke_load.sh

      - name: Unit suites
        run: |
          set -o pipefail   # a failing script must fail the step, whatever the summary line says
          build/release/test/unittest 'test/sql/*' 2>&1 | tee suite.log
          scripts/ci/assert_ran.sh suite.log 3 20

      # the attach tests against the fake service + IdP (specs/002); none of them may skip here
      - name: Attach suites
        run: |
          set -o pipefail   # a failing script must fail the step, whatever the summary line says
          scripts/ci/test_attach.sh 2>&1 | tee attach.log
          scripts/ci/assert_ran.sh attach.log 8 380 'require-env TRESOR_TEST_PORT|require httpfs|require acl_stub'

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: tresor-osx_arm64
          path: build/release/extension/tresor/tresor.duckdb_extension
